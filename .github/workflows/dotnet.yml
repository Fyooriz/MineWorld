name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore MineWorld.sln
      - name: Build
        run: dotnet build MineWorld.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test MineWorld.sln --configuration Release --no-build
