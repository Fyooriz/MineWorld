name: Player Runtime E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  real-input-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install runtime and input dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool libgl1-mesa-dri libx11-6 libxrandr2 libxi6 libxcursor1 libxinerama1 libxext6 libxfixes3
      - name: Restore
        run: dotnet restore MineWorld.sln
      - name: Build Playable
        run: dotnet build src/MineWorld.Playable/MineWorld.Playable.csproj --configuration Release --no-restore
      - name: Real input E2E under focused virtual display
        shell: bash
        run: |
          rm -f saves/runtime-e2e.json /tmp/mineworld-runtime-e2e.log /tmp/openbox-runtime-e2e.log
          mkdir -p saves
          set +e
          xvfb-run -a bash -c '
            openbox --replace >/tmp/openbox-runtime-e2e.log 2>&1 &
            wm=$!
            sleep 1
            MINEWORLD_RUNTIME_E2E=1 MINEWORLD_RUNTIME_E2E_FRAMES=2400 dotnet run --project src/MineWorld.Playable/MineWorld.Playable.csproj --configuration Release --no-build > /tmp/mineworld-runtime-e2e.log 2>&1 &
            app=$!
            for i in $(seq 1 40); do
              wid=$(xdotool search --onlyvisible --name "MineWorld P0" 2>/dev/null | head -n 1)
              if [ -n "$wid" ]; then break; fi
              sleep 0.25
            done
            if [ -z "$wid" ]; then echo "REAL_INPUT_E2E: window not found"; kill "$app" 2>/dev/null; kill "$wm" 2>/dev/null; exit 2; fi

            xdotool windowraise "$wid" 2>/dev/null || true
            xdotool windowactivate --sync "$wid" 2>/dev/null || true
            xdotool windowfocus --sync "$wid" 2>/dev/null || true
            xdotool mousemove --window "$wid" 640 360 2>/dev/null || true
            sleep 1
            active=$(xdotool getactivewindow 2>/dev/null || true)
            focused=$(xdotool getwindowfocus 2>/dev/null || true)
            echo "REAL_INPUT_E2E: window=$wid active=$active focused=$focused"
            if [ "$active" != "$wid" ] || [ "$focused" != "$wid" ]; then
              echo "REAL_INPUT_E2E: target window is not active/focused"
              cat /tmp/openbox-runtime-e2e.log 2>/dev/null || true
              kill "$app" 2>/dev/null
              kill "$wm" 2>/dev/null
              exit 4
            fi

            xdotool keydown --window "$wid" c
            sleep 0.75
            xdotool keyup --window "$wid" c
            craft_deadline=$((SECONDS + 15))
            while [ $SECONDS -lt $craft_deadline ]; do
              if grep -qi "REAL_INPUT_OBSERVED: craft=true" /tmp/mineworld-runtime-e2e.log 2>/dev/null; then
                echo "REAL_INPUT_E2E: craft input observed"
                break
              fi
              if ! kill -0 "$app" 2>/dev/null; then
                echo "REAL_INPUT_E2E: runtime exited before craft input was observed"
                wait "$app" 2>/dev/null
                kill "$wm" 2>/dev/null
                exit 6
              fi
              sleep 0.25
            done
            if ! grep -qi "REAL_INPUT_OBSERVED: craft=true" /tmp/mineworld-runtime-e2e.log 2>/dev/null; then
              echo "REAL_INPUT_E2E: craft input not observed"
              tail -n 40 /tmp/mineworld-runtime-e2e.log 2>/dev/null || true
              kill "$app" 2>/dev/null
              kill "$wm" 2>/dev/null
              exit 8
            fi

            xdotool keydown --window "$wid" F5
            sleep 0.75
            xdotool keyup --window "$wid" F5
            save_deadline=$((SECONDS + 15))
            while [ $SECONDS -lt $save_deadline ]; do
              if grep -qi "REAL_INPUT_OBSERVED:.*save=true" /tmp/mineworld-runtime-e2e.log 2>/dev/null; then
                echo "REAL_INPUT_E2E: save input observed"
                break
              fi
              if ! kill -0 "$app" 2>/dev/null; then
                echo "REAL_INPUT_E2E: runtime exited before save input was observed"
                wait "$app" 2>/dev/null
                kill "$wm" 2>/dev/null
                exit 9
              fi
              sleep 0.25
            done
            if ! grep -qi "REAL_INPUT_OBSERVED:.*save=true" /tmp/mineworld-runtime-e2e.log 2>/dev/null; then
              echo "REAL_INPUT_E2E: save input not observed"
              tail -n 40 /tmp/mineworld-runtime-e2e.log 2>/dev/null || true
              kill "$app" 2>/dev/null
              kill "$wm" 2>/dev/null
              exit 10
            fi

            deadline=$((SECONDS + 15))
            while [ $SECONDS -lt $deadline ]; do
              if [ -f saves/runtime-e2e.json ] && grep -q "\"Name\": \"RuntimeE2E\"" saves/runtime-e2e.json && grep -q "core:dirt" saves/runtime-e2e.json; then
                echo "REAL_INPUT_E2E: persisted state observed"
                kill "$app" 2>/dev/null
                wait "$app" 2>/dev/null
                kill "$wm" 2>/dev/null
                wait "$wm" 2>/dev/null
                exit 0
              fi
              if ! kill -0 "$app" 2>/dev/null; then
                echo "REAL_INPUT_E2E: runtime exited before persisted state was observed"
                wait "$app" 2>/dev/null
                kill "$wm" 2>/dev/null
                exit 6
              fi
              sleep 0.25
            done
            echo "REAL_INPUT_E2E: persisted state timeout"
            tail -n 60 /tmp/mineworld-runtime-e2e.log 2>/dev/null || true
            kill "$app" 2>/dev/null
            wait "$app" 2>/dev/null
            kill "$wm" 2>/dev/null
            wait "$wm" 2>/dev/null
            exit 7
          ' &
          e2e_pid=$!
          wait "$e2e_pid"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "REAL_INPUT_E2E: runtime exited with code $code"
            exit "$code"
          fi
          echo "REAL_INPUT_E2E: PASS"

  performance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore MineWorld.sln
      - name: Build tests
        run: dotnet build tests/MineWorld.Playable.Tests/MineWorld.Playable.Tests.csproj --configuration Release --no-restore
      - name: Measured entity runtime benchmark
        run: dotnet test tests/MineWorld.Playable.Tests/MineWorld.Playable.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~PlayerRuntimePerformanceTests.EntityRuntimeTickThroughputIsMeasured --logger "console;verbosity=detailed"
